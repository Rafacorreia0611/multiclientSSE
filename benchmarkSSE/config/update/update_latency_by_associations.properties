########## BASE DB DATASET ##########

# NDJSON file generated for the synthetic base DB used by PopulateDB.
# Relative paths are resolved from this config file's folder.
baseDatasetOutputPath=../../datasets/update/base_db_keyword_to_docids.ndjson

# Target number of keyword-doc associations present when the measured update starts.
# If warmup payloads are enabled, the populated DB is smaller by the warmup association count.
targetDbAssociationCount=500000

# Exact number of document identifiers associated with each synthetic base DB keyword group.
baseSyntheticDocCounts=1000

# Random seed used for reproducible synthetic base DB datasets.
baseSyntheticSeed=42

########## UPDATE PAYLOAD GENERATION ##########

# NDJSON file generated for the update latency payloads.
# Relative paths are resolved from this config file's folder.
payloadOutputPath=../../datasets/update/update_latency_by_associations.ndjson

# Number of keywords in each measured update payload.
measureKeywordCounts=1,5,10,15

# Number of document identifiers inserted for each measured keyword.
measureDocIdsPerKeyword=1000

# Number of warmup update payloads generated before the measured update.
warmupPayloadCount=10

# Number of keyword-doc associations in each warmup update payload.
warmupAssociationsPerPayload=100

# Number of keywords used inside each warmup update payload.
warmupKeywordsPerPayload=1

# Random seed reserved for reproducible payload generation.
payloadSeed=42

########## DEPLOYMENT ##########

# Number of replicas expected by the benchmark runner.
replicaCount=4

# Number of client folders expected in localDeploy.
deployClientCount=2

# Client directory used to run PopulateDB before this benchmark.
populateClientDir=cli0

# Client identifier used by PopulateDB.
populateClientId=101

# Number of document identifiers grouped into each PopulateDB request.
populateBatchSize=5000

# Client directory used to run the benchmark client.
benchmarkClientDir=cli1

# Client identifier used by the benchmark client process.
clientId=100

########## BENCHMARK EXECUTION ##########

# Benchmark scenario name handled by BenchmarkClient.
scenario=update-latency-by-associations

########## OUTPUTS ##########

# When true, generated CSV artifacts receive a timestamp suffix.
timestampOutputs=true

# NDJSON input consumed by the benchmark.
inputPath=../../datasets/update/update_latency_by_associations.ndjson

# CSV file written by the benchmark run.
outputPath=../../results/data/update_latency_by_associations.csv

# TSV file written by aggregating all single-measurement CSVs from this runner execution.
aggregateOutputPath=../../results/data/update_latency_by_associations_summary.tsv
